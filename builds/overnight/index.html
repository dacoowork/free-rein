<div class="wrap">

<h1>Overnight</h1>
<p class="sub">One parcel, one night, 18:42 to 05:58. Follow the white box from the back of a van through the depot to the lorry that takes it home. Press play, scrub, or jump to a chapter.</p>

(()=>{

[0,'Collected','18:42 · The van','Van 14 pulls up at the depot with the last bag of the day. In it: one white box, tape a little crooked, bound for a flat three counties away.'],
[4.5,'Onto the belt','Label up, please','A hand tosses it onto the induction belt. From here on, nobody has to decide anything. The belt moves at one speed and so does everything on it.'],

{let s=-14;while(s<22){s+=0.8+rnd()*0.75;if(Math.abs(s-4.5)<1.5)continue;

 parcels.push({s,lane,w,h,tape:rnd()<.6,tL:s+(LANEX[lane]-EX)/V,land:s+(LANEX[lane]-EX)/V+130/120});}}
// hero landing: slot in lane-3 cage
const HL=HT+130/120;
const l3=parcels.filter(p=>p.lane===3&&p.land<HL).length;
const slot=k=>({dx:((k%3)-1)*32,y:468-11-Math.floor(k/3)*24});

const HK=cageList.find(c=>c.hero).k, HS=slot(HK);
const sm=x=>x*x*(3-2*x), cl=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
function cageX(t){const b=LANEX[3]+150;

function hero(t){
 if(t<3)return{x:285,y:395,w:50,h:38,r:0,vis:t>1.8};
 if(t<4.5){const u=(t-3)/1.5;return{x:285+135*u,y:395+(255-395)*u-Math.sin(Math.PI*u)*70,w:50,h:38,r:u*6.28,vis:1}}

 const tt=Math.min(1,(t-HL)/.25);
 return{x:cageXfix(t)+HS.dx,y:(HS.y-(1-sm(tt))*20),w:30,h:22,r:0,vis:1,inCage:1}}
function camX(t){let a=0;for(let i=-4;i<=4;i++)a+=hero(cl(t+i*.25,0,DUR)).x;a/=9;return Math.max(0,a-300)}

 if(tape){ctx.fillStyle='rgba(13,18,82,.35)';ctx.fillRect(-3,-h/2,6,h)}
 ctx.fillStyle='#fff';ctx.fillRect(-w/2+4,-h/2+4,Math.min(14,w*.3),8);ctx.restore()}
function draw(t){

 // far skyline (parallax)

 ctx.fillStyle='rgba(255,230,140,.7)';

 // depot hall

 ctx.fillStyle='#1a27b5';ctx.fillRect(hx0,80,hx1-hx0,16);

 for(let x=hx0+120;x<hx1;x+=340){ctx.fillStyle='rgba(8,12,100,.35)';ctx.fillRect(x,160,6,GY-160)}

 ctx.font="400 22px 'Bowlby One',Impact,sans-serif";ctx.textAlign='center';
 LANEX.forEach((x,i)=>{rr(x+104,150,92,44,8,LCOL[i]);ctx.fillStyle='#0d1252';ctx.fillText('BAY '+(i+1),x+150,182)});

 ctx.fillStyle='#0b1170';for(let x=bx0+30;x<bx1;x+=120){ctx.fillRect(x,BY+14,8,GY-BY-14)}
 // hopper
 ctx.fillStyle='#10187f';ctx.beginPath();ctx.moveTo(EX-30,BY-90);ctx.lineTo(EX+30,BY-90);ctx.lineTo(EX+12,BY-34);ctx.lineTo(EX-12,BY-34);ctx.fill();
 // chutes + cages (static part)
 LANEX.forEach((x,i)=>{
  ctx.strokeStyle='#10187f';ctx.lineWidth=14;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(x+6,BY+16);ctx.lineTo(x+140,BY+144);ctx.stroke();
  ctx.strokeStyle=LCOL[i];ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(x+10,BY+10);ctx.lineTo(x+138,BY+138);ctx.stroke();
 });
 // scan arch
 const AX=900;ctx.fillStyle='#0d1252';ctx.fillRect(AX-60,BY-120,12,120);ctx.fillRect(AX+48,BY-120,12,120);rr(AX-66,BY-132,132,22,8,'#0d1252');
 ctx.fillStyle='#fff';ctx.fillRect(AX-30,BY-126,60,10);
 // parcels on belt
 let scanHit=null;
 parcels.forEach(p=>{

 });

  cageDraw(lx,L);

  ctx.save();ctx.translate(x-4,BY-44);ctx.rotate(ang);rr(-5,0,10,60,4,'#ff7a1a','#0d1252',2);ctx.restore();
  ctx.fillStyle='#0d1252';ctx.beginPath();ctx.arc(x-4,BY-44,7,0,7);ctx.fill();ctx.fillStyle='#fff';ctx.fillRect(x-24,BY-60,40,8)});

 if(near){ctx.fillStyle='rgba(255,40,60,.75)';const yy=BY-110+((t*8)%1)*100;ctx.fillRect(AX-44,yy,88,3)}

 }
 lorryDraw(t);
 ctx.restore();
 // HUD (screen space)
 ctx.save();ctx.scale(cv.width/W,cv.height/H);const hk=cv.clientWidth<600?1.45:1;ctx.scale(hk,hk);

 const hm=String(Math.floor(mins/60)).padStart(2,'0')+':'+String(mins%60).padStart(2,'0');
 rr(14,14,150,62,10,'rgba(8,12,90,.78)');ctx.fillStyle='#fff';ctx.font="400 28px 'Bowlby One',Impact,sans-serif";ctx.textAlign='left';ctx.fillText(hm,28,46);
 ctx.font="700 11px 'DM Sans',sans-serif";ctx.fillStyle='#ffd83a';ctx.fillText('PARCEL 0412 · WHITE BOX',28,66);
 if(t>44){const u=cl((t-44)/1.2);ctx.globalAlpha=u;ctx.fillStyle='#fff';ctx.textAlign='center';ctx.font="400 "+(hk>1?34:54)+"px 'Bowlby One',Impact,sans-serif";ctx.fillText('Out for delivery',W/2/hk,(hk>1?120:90)/hk);ctx.globalAlpha=1}

function vanDraw(vx,open){ // facing left, rear at right

 ctx.fillStyle='#9ad7ff';ctx.beginPath();ctx.moveTo(x+6,y-100);ctx.lineTo(x+46,y-100);ctx.lineTo(x+46,y-64);ctx.lineTo(x+6,y-64);ctx.fill();
 ctx.fillStyle='#0d1252';[[x+34,y-12],[x+150,y-12]].forEach(([a,b])=>{ctx.beginPath();ctx.arc(a,b,16,0,7);ctx.fill();ctx.fillStyle='#ccc';ctx.beginPath();ctx.arc(a,b,6,0,7);ctx.fill();ctx.fillStyle='#0d1252'});
 // rear door open

}

 ctx.beginPath();for(let i=1;i<4;i++){ctx.moveTo(x-55+i*27.5,BY+130);ctx.lineTo(x-55+i*27.5,GY-8)}ctx.stroke();
 ctx.fillStyle=LCOL[L];ctx.fillRect(x-55,BY+124,110,6);
 ctx.fillStyle='#0d1252';[-40,40].forEach(d=>{ctx.beginPath();ctx.arc(x+d,GY-4,6,0,7);ctx.fill()})}

   const hh=hero(t);if(hh.inCage){rr(hh.x-15,hh.y-11,30,22,3,'#ffffff','#0d1252',3);ctx.fillStyle='#ff7a1a';ctx.fillRect(hh.x-2,hh.y-11,4,22)}}

 ctx.fillStyle='#0d1252';[[x+60,y-12],[x+280,y-12],[x+410,y-12]].forEach(([a,b])=>{ctx.beginPath();ctx.arc(a,b,18,0,7);ctx.fill();ctx.fillStyle='#ccc';ctx.beginPath();ctx.arc(a,b,7,0,7);ctx.fill();ctx.fillStyle='#0d1252'});

}
// ---- player
let t=0,playing=false,spd=1,last=0;
const $=id=>document.getElementById(id);
const chapsEl=$('chaps');
CH.forEach((c,i)=>{const li=document.createElement('li'),b=document.createElement('button');b.className='';b.innerHTML=c[1]+'<small>'+fmt(c[0])+'</small>';b.onclick=()=>{seek(c[0]+.05)};li.appendChild(b);chapsEl.appendChild(li)});

function seek(x){t=cl(x,0,DUR);ui()}
function setPlay(p){playing=p;$('play').textContent=p?'Pause':(t>=DUR?'Replay':'Play');$('play').setAttribute('aria-label',p?'Pause':'Play');if(p){last=performance.now();requestAnimationFrame(tick)}}
function tick(n){if(!playing)return;t+=(n-last)/1000*spd;last=n;if(t>=DUR){t=DUR;ui();setPlay(false);return}ui();requestAnimationFrame(tick)}
$('play').onclick=()=>{if(!playing&&t>=DUR)t=0;setPlay(!playing)};
cv.onclick=()=>$('play').click();
$('restart').onclick=()=>{t=0;ui();setPlay(true)};
$('scrub').oninput=e=>{seek(+e.target.value)};
$('spd').onclick=()=>{spd=spd===1?2:spd===2?.5:1;$('spd').textContent=spd+'×'};
document.addEventListener('keydown',e=>{if(e.code==='Space'&&e.target.tagName!=='BUTTON'&&e.target.tagName!=='INPUT'){e.preventDefault();$('play').click()}});
window.__film={seek,get t(){return t},get playing(){return playing}};
const rm=matchMedia('(prefers-reduced-motion:reduce)').matches;
const go=()=>{ui();if(!rm)setPlay(true);else{seek(2.6)}};
(document.fonts&&document.fonts.ready?document.fonts.ready.then(go):Promise.resolve().then(go));
})();
</script>
