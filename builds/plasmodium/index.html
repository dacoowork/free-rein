<!doctype html><html><head><meta charset="utf-8"><title>Plasmodium Dish</title><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Young+Serif&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: a single petri dish fills the screen; lab-notebook labels float over the agar, controls sit at the bottom edge. */
:root{
  --agar:#15120b;      /* dark nutrient agar */
  --agar-2:#221c10;
  --slime:#e7a51f;     /* Physarum yellow */
  --pale:#f5e6b0;
  --ink:#d9cfb4;       /* label text on agar */
  --muted:#8c8268;
  --display:"Young Serif",Georgia,"Times New Roman",serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--agar);color:var(--ink);font-family:var(--mono);overflow:hidden}
.app{position:relative;height:100%;display:flex;flex-direction:column}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:crosshair}
header,footer{position:relative;z-index:1;padding-inline:16px;pointer-events:none}
header{padding-block:16px 0;display:grid;gap:4px}
h1{margin:0;font-family:var(--display);font-weight:400;font-size:clamp(1.6rem,5vw,2.4rem);color:var(--pale);text-wrap:balance;line-height:1.05}
h1 i{font-style:normal;color:var(--slime)}
.note{margin:0;font-size:.75rem;color:var(--muted);max-width:42ch;line-height:1.5}
.stats{display:flex;flex-wrap:wrap;gap:4px 16px;margin-top:6px;font-size:.7rem;letter-spacing:.06em;text-transform:uppercase;color:var(--ink);font-variant-numeric:tabular-nums}
.stats b{color:var(--slime);font-weight:500}
footer{margin-top:auto;padding-block:0 16px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
footer>*{pointer-events:auto}
.group{display:flex;gap:0;border:1px solid #3a3020;border-radius:999px;overflow:hidden;background:rgba(21,18,11,.75);backdrop-filter:blur(6px)}
button{font:500 .72rem/1 var(--mono);letter-spacing:.05em;text-transform:uppercase;color:var(--ink);background:transparent;border:0;padding:10px 14px;cursor:pointer}
button+button{border-left:1px solid #3a3020}
button:hover{color:var(--pale);background:var(--agar-2)}
button[aria-pressed="true"]{color:var(--agar);background:var(--slime)}
button:focus-visible{outline:2px solid var(--pale);outline-offset:-2px}
.hint{font-size:.7rem;color:var(--muted);pointer-events:none}
</style>

<div class="app">
  <canvas id="dish" aria-label="Slime mould simulation. Tap to place or remove oat flakes."></canvas>
  <header>
    <h1>Physarum <i>polycephalum</i></h1>
    <p class="note">Every grain of light is a blind agent that smells the trail of others and turns toward it. No one plans the network. Tap the agar to drop an oat flake; tap a flake to take it away.</p>
    <div class="stats" aria-live="off">
      <span>agents <b id="sN">0</b></span>
      <span>oat flakes <b id="sF">0</b></span>
      <span>t = <b id="sT">0</b> s</span>
    </div>
  </header>
  <footer>
    <div class="group" role="group" aria-label="Growth habit">
      <button id="p-veins" aria-pressed="true">Veins</button>
      <button id="p-mesh" aria-pressed="false">Mesh</button>
      <button id="p-rings" aria-pressed="false">Rings</button>
    </div>
    <div class="group">
      <button id="pause">Pause</button>
      <button id="reseed">Reseed</button>
      <button id="clear">Clear oats</button>
    </div>
  </footer>
</div>

<script>
(function(){
const cv=document.getElementById('dish'),ctx=cv.getContext('2d');
const TAU=Math.PI*2;
const presets={
  veins:{SA:0.39,RA:0.39,SD:9,SS:1,DEP:5,DECAY:0.90},
  mesh:{SA:0.79,RA:0.30,SD:14,SS:1.1,DEP:4,DECAY:0.93},
  rings:{SA:1.2,RA:0.6,SD:6,SS:0.9,DEP:6,DECAY:0.86}
};
let P=presets.veins;
let W,H,trail,tmp,img,N,px,py,pa,food=[],t0=performance.now(),paused=false,scale=1;

// colour ramp: agar → umber → slime yellow → pale
const stops=[[0,[21,18,11]],[.18,[60,40,12]],[.5,[200,130,22]],[.8,[240,190,60]],[1,[250,238,190]]];
const lut=new Uint8ClampedArray(256*3);
for(let i=0;i<256;i++){const v=i/255;let k=0;while(k<stops.length-2&&v>stops[k+1][0])k++;
  const[a,ca]=stops[k],[b,cb]=stops[k+1],f=(v-a)/(b-a);
  for(let c=0;c<3;c++)lut[i*3+c]=ca[c]+(cb[c]-ca[c])*f;}

function setup(keepFood){
  const r=cv.getBoundingClientRect();
  scale=Math.max(1,Math.max(r.width,r.height)/420);
  W=Math.max(80,Math.floor(r.width/scale));H=Math.max(80,Math.floor(r.height/scale));
  cv.width=W;cv.height=H;
  trail=new Float32Array(W*H);tmp=new Float32Array(W*H);img=ctx.createImageData(W,H);
  for(let i=3;i<img.data.length;i+=4)img.data[i]=255;
  N=Math.min(40000,Math.floor(W*H*0.22));
  px=new Float32Array(N);py=new Float32Array(N);pa=new Float32Array(N);
  const cx=W/2,cy=H*0.55,R=Math.min(W,H)*0.08;
  for(let i=0;i<N;i++){const a=Math.random()*TAU,d=Math.sqrt(Math.random())*R;
    px[i]=cx+Math.cos(a)*d;py[i]=cy+Math.sin(a)*d;pa[i]=a;}
  if(!keepFood){
    food=[];const m=Math.min(W,H);
    const pts=[[.5,.25],[.18,.45],[.82,.42],[.25,.82],[.75,.85],[.5,.62]];
    for(const[x,y]of pts)food.push({x:W*x,y:H*(0.2+y*0.75)});
  }else{food=food.filter(f=>f.x<W&&f.y<H);}
  t0=performance.now();
  document.getElementById('sN').textContent=N.toLocaleString('en-GB');
  document.getElementById('sF').textContent=food.length;
}

function sense(x,y,a){
  const ix=(x+Math.cos(a)*P.SD)|0,iy=(y+Math.sin(a)*P.SD)|0;
  if(ix<1||iy<1||ix>=W-1||iy>=H-1)return -1;
  return trail[iy*W+ix];
}

function step(){
  const{SA,RA,SS,DEP}=P;
  for(let i=0;i<N;i++){
    let x=px[i],y=py[i],a=pa[i];
    const c=sense(x,y,a),l=sense(x,y,a+SA),r=sense(x,y,a-SA);
    if(c>l&&c>r){}
    else if(c<l&&c<r)a+=(Math.random()<.5?RA:-RA);
    else if(l>r)a+=RA;else if(r>l)a-=RA;
    x+=Math.cos(a)*SS;y+=Math.sin(a)*SS;
    if(x<1||y<1||x>=W-1||y>=H-1){x=Math.min(W-2,Math.max(1,x));y=Math.min(H-2,Math.max(1,y));a=Math.random()*TAU;}
    px[i]=x;py[i]=y;pa[i]=a;
    trail[(y|0)*W+(x|0)]+=DEP;
  }
  for(const f of food){
    const fx=f.x|0,fy=f.y|0;
    for(let dy=-2;dy<=2;dy++)for(let dx=-2;dx<=2;dx++){
      const X=fx+dx,Y=fy+dy;if(X>0&&Y>0&&X<W-1&&Y<H-1)trail[Y*W+X]+=12;}
  }
  const d=P.DECAY/9;
  for(let y=1;y<H-1;y++){const o=y*W;
    for(let x=1;x<W-1;x++){const k=o+x;
      tmp[k]=(trail[k-W-1]+trail[k-W]+trail[k-W+1]+trail[k-1]+trail[k]+trail[k+1]+trail[k+W-1]+trail[k+W]+trail[k+W+1])*d;}}
  const s=trail;trail=tmp;tmp=s;
}

function draw(){
  const data=img.data;
  for(let k=0,j=0;k<W*H;k++,j+=4){
    let v=Math.sqrt(trail[k]/60);if(v>1)v=1;const li=((v*255)|0)*3;
    data[j]=lut[li];data[j+1]=lut[li+1];data[j+2]=lut[li+2];
  }
  ctx.putImageData(img,0,0);
  for(const f of food){
    ctx.beginPath();ctx.ellipse(f.x,f.y,3.2,2.4,0.6,0,TAU);
    ctx.fillStyle='#efe2bf';ctx.fill();
    ctx.strokeStyle='#8a6a2e';ctx.lineWidth=.6;ctx.stroke();
  }
}

let last=0;
function loop(now){
  if(!paused){step();step();draw();
    if(now-last>250){document.getElementById('sT').textContent=Math.floor((now-t0)/1000);last=now;}}
  requestAnimationFrame(loop);
}

cv.addEventListener('pointerdown',e=>{
  const r=cv.getBoundingClientRect(),x=(e.clientX-r.left)/r.width*W,y=(e.clientY-r.top)/r.height*H;
  const hit=food.findIndex(f=>Math.hypot(f.x-x,f.y-y)<7);
  if(hit>=0)food.splice(hit,1);else if(food.length<30)food.push({x,y});
  document.getElementById('sF').textContent=food.length;
  if(paused)draw();
});

const pbtn={veins:document.getElementById('p-veins'),mesh:document.getElementById('p-mesh'),rings:document.getElementById('p-rings')};
for(const k in pbtn)pbtn[k].addEventListener('click',()=>{P=presets[k];for(const j in pbtn)pbtn[j].setAttribute('aria-pressed',j===k);});
const pause=document.getElementById('pause');
function setPaused(v){paused=v;pause.textContent=v?'Play':'Pause';}
pause.addEventListener('click',()=>setPaused(!paused));
document.getElementById('reseed').addEventListener('click',()=>setup(true));
document.getElementById('clear').addEventListener('click',()=>{food=[];document.getElementById('sF').textContent=0;});

let rt;window.addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(()=>setup(false),200);});

setup(false);
// pre-grow so the first frame already shows a network
for(let i=0;i<220;i++)step();
draw();
if(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches)setPaused(true);
requestAnimationFrame(loop);
})();
</script>

</body></html>
