<!doctype html><html><head><meta charset="utf-8"><title>Murmuration</title><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@1,6..96,500&family=Figtree:wght@400;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: full-bleed living sky (canvas), title + dusk clock pinned top, glass control dock pinned bottom. Single dusk look by design. */
:root{
  --ink:#f3ece4;
  --muted:rgba(243,236,228,.7);
  --panel:rgba(14,12,26,.6);
  --line:rgba(243,236,228,.18);
  --accent:#f2a65a;
  --night:#0a0b16;
  --display:"Bodoni Moda",Didot,"Bodoni 72",Georgia,serif;
  --body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--night);color:var(--ink);font-family:var(--body);overflow:hidden;-webkit-user-select:none;user-select:none}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:crosshair}
.top{position:fixed;left:0;right:0;top:0;padding:calc(env(safe-area-inset-top,0px) + 18px) 18px 0;display:flex;justify-content:space-between;align-items:flex-start;gap:12px;pointer-events:none}
h1{font-family:var(--display);font-style:italic;font-weight:500;font-size:clamp(30px,7.5vw,46px);line-height:1;margin:0;text-shadow:0 1px 16px rgba(0,0,0,.25)}
.sub{font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-top:8px}
.clock{text-align:right;font-family:var(--mono);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-variant-numeric:tabular-nums}
.clock b{display:block;font-family:var(--display);font-style:italic;font-weight:500;font-size:21px;letter-spacing:0;text-transform:none;color:var(--ink);margin-bottom:4px}
.hint{position:fixed;left:50%;top:44%;transform:translate(-50%,-50%);font-family:var(--display);font-style:italic;font-size:19px;color:var(--ink);pointer-events:none;transition:opacity 1.4s ease;text-shadow:0 1px 14px rgba(0,0,0,.45);text-align:center;max-width:calc(100% - 32px);text-wrap:balance}
.hint.gone{opacity:0}
.dock{position:fixed;left:16px;right:16px;bottom:calc(env(safe-area-inset-bottom,0px) + 14px);margin:0 auto;max-width:560px;background:var(--panel);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:16px;padding:12px 14px;display:grid;gap:12px}
.sliders{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
label{display:grid;gap:6px;font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);min-width:0}
label span{display:flex;justify-content:space-between;gap:6px}
output{color:var(--ink);font-variant-numeric:tabular-nums;letter-spacing:.04em}
input[type=range]{width:100%;margin:0;accent-color:var(--accent);height:22px}
.actions{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.stat{font-family:var(--mono);font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums;min-width:0}
.stat strong{color:var(--ink);font-weight:500}
button{font:600 13px/1 var(--body);color:#1a1020;background:var(--accent);border:0;border-radius:999px;padding:10px 18px;cursor:pointer;transition:transform .15s ease,filter .15s ease}
button.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
button.ghost[aria-pressed="true"]{border-color:var(--accent);color:var(--accent)}
.btns{display:flex;gap:8px}
button:hover{filter:brightness(1.08)}
button:active{transform:scale(.97)}
button:focus-visible,input:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
@media (prefers-reduced-motion:reduce){.hint,button{transition:none}}
</style>

<canvas id="sky" aria-label="A flock of starlings over a reed bed at dusk. Press and drag to chase them as a falcon."></canvas>

<header class="top">
  <div>
    <h1>Murmuration</h1>
    <div class="sub">Starlings over the reed bed</div>
  </div>
  <div class="clock" aria-live="polite"><b id="light">Golden hour</b><span id="clock">Sunset −15 min</span></div>
</header>

<div class="hint" id="hint">Press and drag to hunt as the peregrine</div>

<section class="dock" aria-label="Flock controls">
  <div class="sliders">
    <label for="size"><span>Flock <output id="sizeOut">1,800</output></span>
      <input id="size" type="range" min="400" max="3000" step="100" value="1800"></label>
    <label for="coh"><span>Cohesion <output id="cohOut">55</output></span>
      <input id="coh" type="range" min="0" max="100" step="1" value="55"></label>
    <label for="wind"><span>Wind <output id="windOut">calm</output></span>
      <input id="wind" type="range" min="-100" max="100" step="5" value="0"></label>
  </div>
  <div class="actions">
    <div class="stat" id="stat"><strong>1,800</strong> starlings · each watches its 7 nearest</div>
    <div class="btns">
      <button id="sound" class="ghost" type="button" aria-pressed="false">Sound on</button>
      <button id="roost" type="button">Send to roost</button>
    </div>
  </div>
</section>

<script>
(() => {
  const cv = document.getElementById('sky');
  const ctx = cv.getContext('2d', { alpha: false });
  const $ = id => document.getElementById(id);
  const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;

  // ---------- state ----------
  const MAX = 3000, K = 7;
  const px = new Float32Array(MAX), py = new Float32Array(MAX);
  const vx = new Float32Array(MAX), vy = new Float32Array(MAX);
  const nvx = new Float32Array(MAX), nvy = new Float32Array(MAX);
  const pa = new Float32Array(MAX), npa = new Float32Array(MAX);
  const sz = new Float32Array(MAX), ph = new Float32Array(MAX);
  const landed = new Uint8Array(MAX);
  const cellIdx = new Int32Array(MAX), birdCell = new Int32Array(MAX);
  let cellStart = new Int32Array(1), fillPtr = new Int32Array(1);
  const bi = new Int32Array(K), bd = new Float32Array(K);

  let W = 0, H = 0, dpr = 1, s = 1, landY = 0;
  let N = 1800, coh = 1, wind = 0;
  let C = 30, gw = 1, gh = 1;
  let time = 0, dusk = 0.06, roosting = false, landedCount = 0, frame = 0;
  const CYCLE = 240; // seconds from golden hour to roost
  const falcon = { x: 0, y: 0, tx: 0, ty: 0, hx: 1, hy: 0, down: false, alpha: 0 };
  let hills = [], reeds = [], stars = [];

  // ---------- setup ----------
  function resize() {
    const oldW = W || innerWidth, oldH = H || innerHeight;
    dpr = Math.min(devicePixelRatio || 1, 2);
    W = innerWidth; H = innerHeight;
    cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    s = Math.max(0.55, Math.min(1.4, Math.min(W, H) / 700));
    landY = H * 0.79;
    C = 34 * s;
    gw = Math.ceil(W / C) + 3; gh = Math.ceil(H / C) + 3;
    const need = gw * gh + 1;
    if (cellStart.length < need) { cellStart = new Int32Array(need); fillPtr = new Int32Array(need); }
    if (oldW !== W || oldH !== H) for (let i = 0; i < N; i++) { px[i] *= W / oldW; py[i] *= H / oldH; }
    buildLand();
  }

  function buildLand() {
    hills = []; reeds = []; stars = [];
    const steps = 60;
    for (let k = 0; k <= steps; k++) {
      const x = W * k / steps;
      const h = Math.sin(k * 0.21 + 1.3) * 10 + Math.sin(k * 0.07) * 18 + Math.sin(k * 0.53) * 4;
      hills.push([x, landY - 22 * s - h * s]);
    }
    const count = Math.round(W / (3.2 * s));
    for (let k = 0; k < count; k++) {
      const x = Math.random() * W;
      const tall = Math.random() < 0.18;
      reeds.push([x, (tall ? 26 : 10 + Math.random() * 14) * s, (Math.random() - 0.5) * 6 * s, tall]);
    }
    for (let k = 0; k < 90; k++) stars.push([Math.random() * W, Math.random() * landY * 0.75, Math.random() * 1.1 + 0.3, Math.random() * 6.28]);
  }

  function spawn(i, cx, cy, spread, up) {
    const a = Math.random() * 6.2832, r = Math.sqrt(Math.random()) * spread;
    px[i] = cx + Math.cos(a) * r; py[i] = cy + Math.sin(a) * r * 0.55;
    const h = up ? -Math.PI / 2 + (Math.random() - 0.5) * 1.6 : (Math.random() - 0.5) * 0.7;
    const sp = (up ? 3.4 : 2.4) * s;
    vx[i] = Math.cos(h) * sp; vy[i] = Math.sin(h) * sp;
    pa[i] = 0; sz[i] = 0.7 + Math.random() * 0.6; ph[i] = Math.random() * 6.2832; landed[i] = 0;
  }

  // wandering point the flock swoops around
  function target(t) {
    if (roosting) return [W * 0.62, landY + 14 * s];
    return [
      W * 0.5 + W * 0.3 * Math.sin(t * 0.0021) * Math.cos(t * 0.0013 + 0.6),
      H * 0.38 + H * 0.12 * Math.sin(t * 0.0017 + 1.1)
    ];
  }

  // ---------- simulation ----------
  function buildGrid() {
    const cells = gw * gh;
    cellStart.fill(0, 0, cells + 1);
    for (let i = 0; i < N; i++) {
      if (landed[i]) { birdCell[i] = -1; continue; }
      let cx = Math.floor(px[i] / C) + 1, cy = Math.floor(py[i] / C) + 1;
      cx = cx < 0 ? 0 : cx >= gw ? gw - 1 : cx;
      cy = cy < 0 ? 0 : cy >= gh ? gh - 1 : cy;
      const c = cy * gw + cx; birdCell[i] = c; cellStart[c + 1]++;
    }
    for (let c = 0; c < cells; c++) cellStart[c + 1] += cellStart[c];
    fillPtr.set(cellStart.subarray(0, cells));
    for (let i = 0; i < N; i++) { const c = birdCell[i]; if (c >= 0) cellIdx[fillPtr[c]++] = i; }
  }

  function step(k) {
    buildGrid();
    const R2 = C * C, SEPR = 10 * s, SEP2 = SEPR * SEPR;
    const minV = 1.7 * s, maxV = 3.3 * s;
    const [tx, ty] = target(time);
    const fearR = 120 * s, fearOn = falcon.down;
    const margin = 50 * s;
    const ALI = 0.07, COH = 0.0045 * coh, SEPW = 0.32 * s;
    const ATT = (roosting ? 0.0016 : 0.00032 * (0.5 + coh * 0.5));
    const attCap = (roosting ? 0.2 : 0.09) * s;

    for (let i = 0; i < N; i++) {
      if (landed[i]) continue;
      const x = px[i], y = py[i];
      let n = 0, exam = 0;
      const c = birdCell[i], ccx = c % gw, ccy = (c / gw) | 0;
      outer:
      for (let oy = -1; oy <= 1; oy++) {
        const cy2 = ccy + oy; if (cy2 < 0 || cy2 >= gh) continue;
        for (let ox = -1; ox <= 1; ox++) {
          const cx2 = ccx + ox; if (cx2 < 0 || cx2 >= gw) continue;
          const cc = cy2 * gw + cx2;
          for (let q = cellStart[cc], e = cellStart[cc + 1]; q < e; q++) {
            const j = cellIdx[q]; if (j === i) continue;
            const dx = px[j] - x, dy = py[j] - y, d2 = dx * dx + dy * dy;
            if (d2 > R2) continue;
            if (n < K) {
              let m = n++; while (m > 0 && bd[m - 1] > d2) { bd[m] = bd[m - 1]; bi[m] = bi[m - 1]; m--; }
              bd[m] = d2; bi[m] = j;
            } else if (d2 < bd[K - 1]) {
              let m = K - 1; while (m > 0 && bd[m - 1] > d2) { bd[m] = bd[m - 1]; bi[m] = bi[m - 1]; m--; }
              bd[m] = d2; bi[m] = j;
            }
            if (++exam > 48) break outer;
          }
        }
      }

      let ax = 0, ay = 0, p = pa[i] * 0.965;
      if (n) {
        let sx = 0, sy = 0, avx = 0, avy = 0, cx = 0, cy = 0, mp = 0;
        for (let m = 0; m < n; m++) {
          const j = bi[m], dx = px[j] - x, dy = py[j] - y;
          avx += vx[j]; avy += vy[j]; cx += dx; cy += dy;
          if (bd[m] < SEP2) { const d = Math.sqrt(bd[m]) + 0.01, f = 1 - d / SEPR; sx -= dx / d * f; sy -= dy / d * f; }
          if (pa[j] > mp) mp = pa[j];
        }
        avx /= n; avy /= n;
        ax += (avx - vx[i]) * ALI + (cx / n) * COH + sx * SEPW * (1 + p);
        ay += (avy - vy[i]) * ALI + (cy / n) * COH + sy * SEPW * (1 + p);
        if (mp * 0.9 > p) p = mp * 0.9; // fear spreads through neighbours
      }

      // pull toward the wandering swoop point
      let gx = (tx - x) * ATT, gy = (ty - y) * ATT;
      const g = Math.hypot(gx, gy); if (g > attCap) { gx *= attCap / g; gy *= attCap / g; }
      ax += gx; ay += gy;

      // soft edges
      if (x < margin) ax += 0.14 * s; else if (x > W - margin) ax -= 0.14 * s;
      if (y < margin + 40 * s) ay += 0.12 * s;
      else if (!roosting && y > landY - 40 * s) ay -= 0.16 * s;

      // the falcon
      if (fearOn) {
        const dx = x - falcon.x, dy = y - falcon.y, d = Math.hypot(dx, dy) + 0.01;
        if (d < fearR) {
          const f = 1 - d / fearR;
          ax += dx / d * f * 1.1 * s; ay += dy / d * f * 1.1 * s;
          if (d < fearR * 0.75 && f > p) p = Math.min(1, f + 0.3);
        }
      }

      ax += wind * 0.03 * s + (Math.random() - 0.5) * 0.04 * s;
      ay += (Math.random() - 0.5) * 0.04 * s;

      let nx = vx[i] + ax * k, ny = vy[i] + ay * k;
      const sp = Math.hypot(nx, ny), top = maxV * (1 + 0.75 * p);
      if (sp > top) { nx *= top / sp; ny *= top / sp; }
      else if (sp < minV) { nx *= minV / (sp + 1e-4); ny *= minV / (sp + 1e-4); }
      nvx[i] = nx; nvy[i] = ny; npa[i] = p;
    }

    const rx = W * 0.62, rHalf = W * 0.3;
    for (let i = 0; i < N; i++) {
      if (landed[i]) continue;
      vx[i] = nvx[i]; vy[i] = nvy[i]; pa[i] = npa[i];
      px[i] += vx[i] * k; py[i] += vy[i] * k;
      if (roosting && py[i] > landY + 2 * s && Math.abs(px[i] - rx) < rHalf && Math.random() < 0.25) {
        landed[i] = 1; landedCount++;
      }
    }
    time += k;
  }

  // ---------- colour ----------
  const hex = h => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
  const KF = [
    [0.00, ['#3b5c8a', '#c48c72', '#f3b766']],
    [0.35, ['#2d3c6c', '#a3667d', '#ee8a5e']],
    [0.65, ['#18254a', '#4c4a7a', '#b06f7c']],
    [1.00, ['#070a18', '#121733', '#2a2648']]
  ].map(([t, c]) => [t, c.map(hex)]);
  function skyAt(t) {
    let a = KF[0], b = KF[KF.length - 1];
    for (let k = 0; k < KF.length - 1; k++) if (t >= KF[k][0] && t <= KF[k + 1][0]) { a = KF[k]; b = KF[k + 1]; break; }
    const f = (t - a[0]) / ((b[0] - a[0]) || 1), e = f * f * (3 - 2 * f);
    return a[1].map((c, n) => c.map((v, m) => Math.round(v + (b[1][n][m] - v) * e)));
  }
  const rgb = (c, al = 1) => `rgba(${c[0]},${c[1]},${c[2]},${al})`;

  // ---------- drawing ----------
  function draw() {
    const t = Math.min(dusk, 1);
    const [top, mid, hor] = skyAt(t);
    const g = ctx.createLinearGradient(0, 0, 0, landY);
    g.addColorStop(0, rgb(top)); g.addColorStop(0.62, rgb(mid)); g.addColorStop(1, rgb(hor));
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);

    // stars as night falls
    if (t > 0.62) {
      const a = Math.min(1, (t - 0.62) / 0.3);
      ctx.fillStyle = '#fff6e8';
      for (const [x, y, r, tw] of stars) {
        ctx.globalAlpha = a * (0.45 + 0.35 * Math.sin(time * 0.02 + tw));
        ctx.fillRect(x, y, r, r);
      }
      ctx.globalAlpha = 1;
    }

    // sun sinking behind the hills
    const sunX = W * 0.26, sunY = landY - 28 * s - H * 0.16 * (1 - t / 0.36);
    const glow = ctx.createRadialGradient(sunX, sunY, 0, sunX, sunY, Math.max(W, H) * 0.55);
    const ga = Math.max(0, 0.55 - t * 0.6);
    glow.addColorStop(0, `rgba(255,214,150,${ga})`); glow.addColorStop(1, 'rgba(255,214,150,0)');
    ctx.fillStyle = glow; ctx.fillRect(0, 0, W, landY);
    if (t < 0.42) { ctx.fillStyle = `rgba(255,228,180,${0.95 - t * 1.4})`; ctx.beginPath(); ctx.arc(sunX, sunY, 17 * s, 0, 6.2832); ctx.fill(); }

    // far hills
    ctx.fillStyle = rgb(top.map((v, n) => Math.round(v * 0.45 + hor[n] * 0.12)), 0.92);
    ctx.beginPath(); ctx.moveTo(0, landY + 2);
    for (const [x, y] of hills) ctx.lineTo(x, y);
    ctx.lineTo(W, landY + 2); ctx.closePath(); ctx.fill();

    // birds
    const flapAmp = reduceMotion ? 0.25 : 0.9;
    const bird = '#120e18';
    ctx.fillStyle = bird;
    const night = Math.max(0, (t - 0.75) / 0.25);
    ctx.globalAlpha = 0.8 - night * 0.25;
    const L0 = 3.3 * s;
    for (let start = 0; start < N; start += 300) {
      ctx.beginPath();
      const end = Math.min(N, start + 300);
      for (let i = start; i < end; i++) {
        if (landed[i]) continue;
        const sp = Math.hypot(vx[i], vy[i]) + 1e-4, ux = vx[i] / sp, uy = vy[i] / sp;
        const L = L0 * sz[i], w = 1.05 + flapAmp * Math.sin(time * (0.5 + pa[i] * 0.4) + ph[i]);
        const x = px[i], y = py[i];
        ctx.moveTo(x + ux * L, y + uy * L);
        ctx.lineTo(x - ux * L * 0.35 - uy * L * w, y - uy * L * 0.35 + ux * L * w);
        ctx.lineTo(x - ux * L * 0.55, y - uy * L * 0.55);
        ctx.lineTo(x - ux * L * 0.35 + uy * L * w, y - uy * L * 0.35 - ux * L * w);
        ctx.closePath();
      }
      ctx.fill();
    }
    ctx.globalAlpha = 1;

    // reed bed
    ctx.fillStyle = '#0c0a12';
    ctx.fillRect(0, landY, W, H - landY);
    ctx.strokeStyle = '#0c0a12'; ctx.lineWidth = 1.3 * s; ctx.lineCap = 'round';
    ctx.beginPath();
    const sway = reduceMotion ? 0 : Math.sin(time * 0.012) * 2 * s + wind * 3 * s;
    for (const [x, h, lean] of reeds) { ctx.moveTo(x, landY + 1); ctx.quadraticCurveTo(x + lean * 0.4, landY - h * 0.6, x + lean + sway, landY - h); }
    ctx.stroke();
    ctx.lineWidth = 2.6 * s; ctx.beginPath();
    for (const [x, h, lean, tall] of reeds) if (tall) { const hx = x + lean + sway, hy = landY - h; ctx.moveTo(hx, hy); ctx.lineTo(hx + lean * 0.15, hy - 5 * s); }
    ctx.stroke();

    // falcon
    if (falcon.alpha > 0.01) {
      const { x, y, hx, hy } = falcon, L = 12 * s;
      ctx.globalAlpha = falcon.alpha; ctx.fillStyle = '#07060b';
      ctx.beginPath();
      ctx.moveTo(x + hx * L, y + hy * L);
      ctx.lineTo(x - hx * L * 0.15 - hy * L * 1.25, y - hy * L * 0.15 + hx * L * 1.25);
      ctx.lineTo(x - hx * L * 0.35, y - hy * L * 0.35);
      ctx.lineTo(x - hx * L * 0.9 - hy * L * 0.25, y - hy * L * 0.9 + hx * L * 0.25);
      ctx.lineTo(x - hx * L * 0.9 + hy * L * 0.25, y - hy * L * 0.9 - hx * L * 0.25);
      ctx.lineTo(x - hx * L * 0.35, y - hy * L * 0.35);
      ctx.lineTo(x - hx * L * 0.15 + hy * L * 1.25, y - hy * L * 0.15 - hx * L * 1.25);
      ctx.closePath(); ctx.fill();
      ctx.globalAlpha = 1;
    }
  }

  // ---------- UI ----------
  const fmt = n => n.toLocaleString('en-GB');
  function updateLabels() {
    const t = dusk;
    $('light').textContent = roosting ? (landedCount >= N * 0.97 ? 'Roosting' : 'Dropping to roost')
      : t < 0.22 ? 'Golden hour' : t < 0.45 ? 'Sunset' : t < 0.72 ? 'Blue hour' : 'Dusk';
    const m = Math.round(-15 + 55 * Math.min(t, 1));
    const rel = m === 0 ? 'Sunset now' : `Sunset ${m < 0 ? '−' : '+'}${Math.abs(m)} min`;
    let roostTxt = '';
    if (!roosting) {
      const left = Math.max(0, (0.88 - t) * CYCLE), mm = Math.floor(left / 60), ss = Math.floor(left % 60);
      roostTxt = ` · roost in ${mm}:${String(ss).padStart(2, '0')}`;
    }
    $('clock').textContent = rel + roostTxt;
    const flying = N - landedCount;
    $('stat').innerHTML = roosting
      ? `<strong>${fmt(landedCount)}</strong> of ${fmt(N)} settled in the reeds`
      : `<strong>${fmt(flying)}</strong> starlings · each watches its 7 nearest`;
    $('roost').textContent = roosting ? 'Fly again' : 'Send to roost';
  }

  function startRoost() { if (!roosting) { roosting = true; dusk = Math.max(dusk, 0.8); } }
  function flyAgain() {
    roosting = false; landedCount = 0; dusk = 0.06; settleChatter = 0;
    for (let i = 0; i < N; i++) spawn(i, W * 0.62 + (Math.random() - 0.5) * W * 0.4, landY + 6 * s, 10 * s, true);
  }
  $('roost').addEventListener('click', () => { roosting ? flyAgain() : startRoost(); updateLabels(); });

  $('size').addEventListener('input', e => {
    const n = +e.target.value;
    if (n > N) for (let i = N; i < n; i++) {
      if (roosting) { spawn(i, 0, 0, 0, false); landed[i] = 1; landedCount++; px[i] = W * 0.62; py[i] = landY + 10; }
      else { const j = (Math.random() * N) | 0; spawn(i, px[j], py[j], 8 * s, false); vx[i] = vx[j]; vy[i] = vy[j]; }
    } else for (let i = n; i < N; i++) if (landed[i]) landedCount--;
    N = n; $('sizeOut').textContent = fmt(n); updateLabels();
  });
  $('coh').addEventListener('input', e => { const v = +e.target.value; coh = 0.25 + v / 100 * 1.6; $('cohOut').textContent = v; });
  $('wind').addEventListener('input', e => {
    const v = +e.target.value; wind = v / 100;
    $('windOut').textContent = v === 0 ? 'calm' : `${Math.abs(v)} ${v < 0 ? 'W' : 'E'}`;
  });

  // ---------- sound (all synthesised, starts from the Sound button) ----------
  let audio = null, soundOn = false, lastKek = -1e9, settleChatter = 0;
  function makeNoise(ac, brown) {
    const len = ac.sampleRate * 2, buf = ac.createBuffer(1, len, ac.sampleRate), d = buf.getChannelData(0);
    let last = 0;
    for (let i = 0; i < len; i++) {
      const w = Math.random() * 2 - 1;
      if (brown) { last = (last + 0.02 * w) / 1.02; d[i] = last * 3.5; } else d[i] = w;
    }
    const src = ac.createBufferSource(); src.buffer = buf; src.loop = true; return src;
  }
  function initAudio() {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return null;
    const ac = new AC();
    const master = ac.createGain(); master.gain.value = 0; master.connect(ac.destination);
    const comp = ac.createDynamicsCompressor(); comp.connect(master);

    // wing rush: band-passed white noise, panned with the flock
    const wn = makeNoise(ac, false), wf = ac.createBiquadFilter(), wg = ac.createGain();
    const pan = ac.createStereoPanner ? ac.createStereoPanner() : null;
    wf.type = 'bandpass'; wf.frequency.value = 1100; wf.Q.value = 0.6; wg.gain.value = 0;
    wn.connect(wf); wf.connect(wg);
    if (pan) { wg.connect(pan); pan.connect(comp); } else wg.connect(comp);
    wn.start();

    // wind: low brown noise
    const bn = makeNoise(ac, true), bf = ac.createBiquadFilter(), bg = ac.createGain();
    bf.type = 'lowpass'; bf.frequency.value = 380; bg.gain.value = 0.05;
    bn.connect(bf); bf.connect(bg); bg.connect(comp); bn.start();

    return { ac, master, comp, wf, wg, pan, bf, bg };
  }

  function chirp(when, vol) {
    const { ac, comp } = audio;
    const o = ac.createOscillator(), g = ac.createGain(), p = ac.createStereoPanner ? ac.createStereoPanner() : null;
    const kind = Math.random();
    let f0, f1, dur;
    if (kind < 0.55) { o.type = 'sine'; f0 = 2600 + Math.random() * 3400; f1 = f0 * (0.6 + Math.random() * 0.9); dur = 0.04 + Math.random() * 0.09; }
    else if (kind < 0.85) { o.type = 'triangle'; f0 = 1800 + Math.random() * 1500; f1 = f0 * 1.8; dur = 0.12 + Math.random() * 0.1; } // rising whistle
    else { o.type = 'square'; f0 = f1 = 2800 + Math.random() * 1500; dur = 0.012; vol *= 0.35; } // dry click
    o.frequency.setValueAtTime(f0, when);
    o.frequency.exponentialRampToValueAtTime(Math.max(200, f1), when + dur);
    g.gain.setValueAtTime(0.0001, when);
    g.gain.exponentialRampToValueAtTime(vol, when + 0.006);
    g.gain.exponentialRampToValueAtTime(0.0001, when + dur);
    o.connect(g);
    if (p) { p.pan.value = Math.random() * 1.6 - 0.8; g.connect(p); p.connect(comp); } else g.connect(comp);
    o.start(when); o.stop(when + dur + 0.02);
    if (kind >= 0.85 && Math.random() < 0.6) for (let r = 1; r < 4; r++) chirp(when + r * 0.03, vol); // rattle
  }

  function kek() {
    const { ac, comp } = audio, t0 = ac.currentTime + 0.02;
    for (let r = 0; r < 4; r++) {
      const t = t0 + r * 0.13, o = ac.createOscillator(), f = ac.createBiquadFilter(), g = ac.createGain();
      o.type = 'sawtooth';
      o.frequency.setValueAtTime(2100, t); o.frequency.exponentialRampToValueAtTime(1500, t + 0.08);
      f.type = 'bandpass'; f.frequency.value = 2200; f.Q.value = 3;
      g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.16, t + 0.01); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.09);
      o.connect(f); f.connect(g); g.connect(comp); o.start(t); o.stop(t + 0.1);
    }
  }

  function soundTick(k) {
    if (!audio || !soundOn) return;
    const { ac, wf, wg, pan, bf, bg } = audio, now = ac.currentTime;
    if (frame % 3 === 0) {
      let fl = 0, sp = 0, pn = 0, sx = 0, near = 0;
      const cx = W / 2, cy = H * 0.45, r2 = Math.pow(Math.min(W, H) * 0.38, 2);
      for (let i = 0; i < N; i++) {
        if (landed[i]) continue;
        fl++; sp += Math.hypot(vx[i], vy[i]); pn += pa[i]; sx += px[i];
        const dx = px[i] - cx, dy = py[i] - cy; if (dx * dx + dy * dy < r2) near++;
      }
      const f = fl || 1, speed = Math.min(1, sp / f / (3.3 * s * 1.4)), panic = pn / f;
      const nearFrac = near / Math.max(N, 1), size = Math.min(1, fl / 1800);
      const rush = fl ? (0.02 + 0.5 * nearFrac * speed + 0.35 * panic) * (0.5 + 0.5 * size) : 0;
      wg.gain.setTargetAtTime(Math.min(0.6, rush), now, 0.15);
      wf.frequency.setTargetAtTime(700 + 1300 * speed + 900 * panic, now, 0.2);
      if (pan && fl) pan.pan.setTargetAtTime(Math.max(-0.9, Math.min(0.9, (sx / f / W - 0.5) * 1.6)), now, 0.3);
      bg.gain.setTargetAtTime(0.035 + Math.abs(wind) * 0.16, now, 0.4);
      bf.frequency.setTargetAtTime(300 + Math.abs(wind) * 500, now, 0.4);
      audio.flying = fl; audio.panic = panic;
    }
    // chatter: lively in flight, loudest as they settle into the reeds, then fading into night
    const flyFrac = (audio.flying || 0) / Math.max(N, 1);
    if (roosting) settleChatter = Math.min(1, settleChatter + 0.004 * k * (landedCount / Math.max(N, 1)));
    const nightFade = dusk >= 1 ? Math.max(0, settleChatter - 0.0008 * k) : settleChatter;
    settleChatter = nightFade;
    const rate = (flyFrac * 0.18 + (audio.panic || 0) * 0.5 + settleChatter * 0.9) * k;
    let n = Math.floor(rate) + (Math.random() < rate % 1 ? 1 : 0);
    while (n-- > 0) chirp(now + Math.random() * 0.05, 0.015 + Math.random() * 0.03);
  }

  $('sound').addEventListener('click', () => {
    if (!audio) audio = initAudio();
    if (!audio) { $('sound').textContent = 'No sound here'; $('sound').disabled = true; return; }
    soundOn = !soundOn;
    if (audio.ac.state === 'suspended') audio.ac.resume();
    audio.master.gain.setTargetAtTime(soundOn ? 0.9 : 0, audio.ac.currentTime, 0.25);
    $('sound').textContent = soundOn ? 'Sound off' : 'Sound on';
    $('sound').setAttribute('aria-pressed', String(soundOn));
  });

  // falcon control
  const hint = $('hint');
  function pointAt(e) { falcon.tx = e.clientX; falcon.ty = e.clientY; }
  cv.addEventListener('pointerdown', e => {
    falcon.down = true; pointAt(e);
    if (falcon.alpha < 0.05) { falcon.x = e.clientX; falcon.y = e.clientY; }
    hint.classList.add('gone');
    if (audio && soundOn && performance.now() - lastKek > 2500) { kek(); lastKek = performance.now(); }
    try { cv.setPointerCapture(e.pointerId); } catch (_) {}
  });
  cv.addEventListener('pointermove', e => { if (falcon.down) pointAt(e); });
  const up = () => { falcon.down = false; };
  cv.addEventListener('pointerup', up); cv.addEventListener('pointercancel', up);

  function updateFalcon(k) {
    if (falcon.down) {
      const dx = (falcon.tx - falcon.x) * 0.3 * k, dy = (falcon.ty - falcon.y) * 0.3 * k;
      falcon.x += dx; falcon.y += dy;
      const d = Math.hypot(dx, dy);
      if (d > 0.4) { falcon.hx += (dx / d - falcon.hx) * 0.3; falcon.hy += (dy / d - falcon.hy) * 0.3; const h = Math.hypot(falcon.hx, falcon.hy) || 1; falcon.hx /= h; falcon.hy /= h; }
      falcon.alpha = Math.min(1, falcon.alpha + 0.15 * k);
    } else {
      falcon.x += falcon.hx * 6 * s * k; falcon.y += falcon.hy * 6 * s * k;
      falcon.alpha = Math.max(0, falcon.alpha - 0.04 * k);
    }
  }

  // ---------- loop ----------
  resize();
  addEventListener('resize', resize);
  const [sx0, sy0] = target(0);
  for (let i = 0; i < N; i++) spawn(i, sx0, sy0, 90 * s, false);
  for (let w = 0; w < 160; w++) step(1); // let them settle into a flock before the first frame
  updateLabels();
  draw();

  let last = performance.now();
  function loop(now) {
    const dt = Math.min(50, now - last); last = now;
    const k = dt / 16.667;
    if (!roosting) { dusk += dt / 1000 / CYCLE; if (dusk >= 0.88) startRoost(); }
    else if (dusk < 1) dusk = Math.min(1, dusk + dt / 1000 / CYCLE);
    updateFalcon(k);
    step(Math.min(k, 2));
    draw();
    soundTick(Math.min(k, 2));
    if (++frame % 12 === 0) updateLabels();
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
  setTimeout(() => hint.classList.add('gone'), 9000);
})();
</script>

</body></html>
