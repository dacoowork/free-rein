<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Free Rein</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@500;700&display=swap">
<style>
:root{--bg:#18212b;--fg:#e8edf2;--accent:#dde2e7;--font:"Schibsted Grotesk",system-ui,-apple-system,"Segoe UI",sans-serif}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);font-family:var(--font)}
body{display:flex;flex-direction:column}
nav{flex:0 0 auto;display:flex;align-items:center;gap:14px;padding:calc(env(safe-area-inset-top,0px) + 8px) 16px 8px;font-size:14px;font-weight:500;border-bottom:1px solid rgba(255,255,255,.1)}
nav a{color:var(--fg);text-decoration:none;opacity:.75;white-space:nowrap}
nav a:hover{opacity:1}
nav a:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:4px;opacity:1}
.home{font-weight:700;opacity:1}
.title{flex:1;min-width:0;text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--accent)}
iframe{flex:1;width:100%;border:0;display:block;background:var(--bg)}
.missing{flex:1;display:grid;place-items:center;padding:24px;text-align:center}
.missing a{color:var(--accent)}
@media (max-width:420px){.full{display:none}}
</style>
</head>
<body>
<nav aria-label="Free Rein">
  <a class="home" href="./">Free Rein</a>
  <span class="title" id="title"></span>
  <a id="next" href="#">Next build</a>
  <a class="full" id="full" href="#">Full screen</a>
</nav>
<script src="builds.js?v=2026-10-29c"></script>
<script>
(function(){
  const B = window.BUILDS || [];
  const slug = new URLSearchParams(location.search).get('b');
  const i = B.findIndex(b => b.slug === slug);
  if (i < 0) {
    document.getElementById('next').remove(); document.getElementById('full').remove();
    const m = document.createElement('div'); m.className = 'missing';
    m.innerHTML = '<p>That build isn\'t here. <a href="./">See all the builds</a></p>';
    document.body.appendChild(m); return;
  }
  const b = B[i], src = 'builds/' + b.slug + '/';
  document.title = b.title + ' · Free Rein';
  const root = document.documentElement.style;
  root.setProperty('--bg', b.panel || b.bg); root.setProperty('--fg', b.fg); root.setProperty('--accent', b.accent);
  document.getElementById('title').textContent = b.title;
  document.getElementById('full').href = src;
  const n = B[(i + 1) % B.length];
  const next = document.getElementById('next');
  if (B.length < 2) next.remove(); else { next.href = 'play.html?b=' + encodeURIComponent(n.slug); next.title = n.title; }
  const f = document.createElement('iframe');
  f.src = src; f.title = b.title; f.allow = 'autoplay; fullscreen; clipboard-write';
  document.body.appendChild(f);
  f.addEventListener('load', () => { try { f.contentWindow.focus(); } catch (e) {} });
})();
</script>
</body>
</html>
