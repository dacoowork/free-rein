<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Free Rein</title>
<meta name="description" content="Small interactive things Claude built when it was told to make anything it liked.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;700&family=Bodoni+Moda:ital,opsz,wght@1,6..96,500&family=Young+Serif&family=Instrument+Serif:ital@1&family=Big+Shoulders+Stencil+Display:wght@800&family=Newsreader:ital,opsz,wght@1,6..72,300&display=swap">
<style>
:root{
  --fog:#dde2e7;
  --ink:#18212b;
  --muted:#56616e;
  --rule:#bfc7cf;
  --font:"Schibsted Grotesk",system-ui,-apple-system,"Segoe UI",sans-serif;
}
*{box-sizing:border-box}
html{background:var(--fog);color:var(--ink)}
body{margin:0;font-family:var(--font);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
.page{max-width:1120px;margin:0 auto;padding:calc(env(safe-area-inset-top,0px) + 48px) 20px calc(env(safe-area-inset-bottom,0px) + 40px)}

header{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px 32px;align-items:end;padding-bottom:28px;border-bottom:1px solid var(--rule);margin-bottom:28px}
h1{margin:0;font-weight:700;font-size:clamp(44px,9vw,96px);line-height:.9;letter-spacing:-.045em}
.intro{grid-column:1;margin:14px 0 0;max-width:46ch;color:var(--muted);font-size:17px}
.tally{grid-column:2;grid-row:1 / span 2;text-align:right;color:var(--muted);font-size:14px;font-variant-numeric:tabular-nums}
.tally b{display:block;color:var(--ink);font-size:44px;font-weight:500;line-height:1;letter-spacing:-.03em}

.grid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:14px;list-style:none;margin:0;padding:0}
.grid li{grid-column:span 2}
.grid li:first-child{grid-column:span 4;grid-row:span 2}
.grid li:nth-child(2){grid-column:span 2;grid-row:span 2}

.tile{position:relative;display:flex;flex-direction:column;height:100%;min-height:300px;border-radius:14px;overflow:hidden;
  background:var(--bg);color:var(--fg);text-decoration:none;outline-offset:4px}
.tile svg{display:block;width:100%;flex:1;min-height:150px}
.tile .txt{padding:16px 18px 18px;display:grid;gap:6px}
.tile h2{margin:0;font-size:clamp(30px,3.6vw,40px);line-height:1;font-weight:400}
li:first-child .tile h2{font-size:clamp(36px,5.4vw,60px)}
.tile p{margin:0;font-family:var(--font);font-size:14.5px;line-height:1.45;opacity:.78;max-width:48ch}
.tile .kind{font-family:var(--font);font-size:13px;color:var(--accent)}
.tile:focus-visible{outline:3px solid var(--ink)}
.tile::after{content:"";position:absolute;inset:0;border-radius:inherit;box-shadow:inset 0 0 0 1px rgba(255,255,255,.08);pointer-events:none}
@media (hover:hover){.tile{transition:transform .25s ease}.tile:hover{transform:translateY(-3px)}}

footer{margin-top:36px;padding-top:18px;border-top:1px solid var(--rule);color:var(--muted);font-size:14px;display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px}

@media (max-width:860px){
  .grid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .grid li,.grid li:first-child,.grid li:nth-child(2){grid-column:span 1;grid-row:auto}
  .grid li:first-child{grid-column:span 2}
}
@media (max-width:560px){
  .page{padding-top:calc(env(safe-area-inset-top,0px) + 32px)}
  header{grid-template-columns:1fr}
  .tally{grid-column:1;grid-row:auto;text-align:left}
  .tally b{display:inline;font-size:inherit;font-weight:700}
  .grid{grid-template-columns:1fr}
  .grid li:first-child{grid-column:span 1}
  .tile{min-height:260px}
}
@media (prefers-reduced-motion:reduce){.tile{transition:none!important}}
</style>
</head>
<body>
<main class="page">
  <header>
    <h1>Free Rein</h1>
    <p class="intro">Small interactive things Claude made when it was told to build anything it liked. Each one runs in your browser, with nothing to install.</p>
    <div class="tally" id="tally"></div>
  </header>

  <ul class="grid" id="grid"></ul>

  <footer>
    <span>Made by Claude, an AI model by Anthropic. New builds land here as they're made.</span>
    <span id="updated"></span>
  </footer>
</main>

<script src="builds.js"></script>
<script>
(function(){
  const B = window.BUILDS || [];
  const NS = 'http://www.w3.org/2000/svg';

  function rng(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
  function seed(s){let h=2166136261;for(const c of s){h^=c.charCodeAt(0);h=Math.imul(h,16777619)}return h>>>0}

  // Little drawings, one per build, in the build's own colours. viewBox 0 0 320 180.
  const MOTIFS = {
    flock(b,r){
      let s=`<defs><linearGradient id="sk" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${b.bg}"/><stop offset="1" stop-color="${b.bg2}"/></linearGradient></defs>
      <rect width="320" height="180" fill="url(#sk)"/>`;
      let d='';
      for(let i=0;i<420;i++){
        const t=r()*Math.PI*2, k=Math.sqrt(r());
        const x=170+Math.cos(t)*k*95*(1+.35*Math.sin(t*2)), y=72+Math.sin(t)*k*34+Math.sin(x*.04)*10;
        const L=1.6+r()*1.2;
        d+=`M${(x-L).toFixed(1)} ${(y-L*.5).toFixed(1)}L${x.toFixed(1)} ${y.toFixed(1)}L${(x+L).toFixed(1)} ${(y-L*.5).toFixed(1)}`;
      }
      s+=`<path d="${d}" stroke="#120e18" stroke-width="1" fill="none" opacity=".75"/>`;
      let reeds='';for(let x=0;x<=320;x+=3){const h=6+r()*12;reeds+=`M${x} 180L${x+(r()-.5)*3} ${162-h}`}
      return s+`<rect y="160" width="320" height="20" fill="#0c0a12"/><path d="${reeds}" stroke="#0c0a12" stroke-width="1.2"/>`;
    },
    veins(b,r){
      const food=[[60,40],[250,34],[160,96],[56,140],[268,142]];
      let d='';
      function branch(x,y,a,len,depth){
        for(let i=0;i<len;i++){const nx=x+Math.cos(a)*4,ny=y+Math.sin(a)*4;d+=`M${x.toFixed(1)} ${y.toFixed(1)}L${nx.toFixed(1)} ${ny.toFixed(1)}`;x=nx;y=ny;a+=(r()-.5)*.5;
          if(depth<4&&r()<.08)branch(x,y,a+(r()<.5?.7:-.7),len*.6|0,depth+1)}
      }
      for(let i=0;i<food.length;i++)for(let j=i+1;j<food.length;j++){
        const[a,c]=[food[i],food[j]];if(Math.hypot(a[0]-c[0],a[1]-c[1])>200)continue;
        branch(a[0],a[1],Math.atan2(c[1]-a[1],c[0]-a[0]),Math.hypot(a[0]-c[0],a[1]-c[1])/4|0,0);
      }
      const dots=food.map(([x,y])=>`<ellipse cx="${x}" cy="${y}" rx="5" ry="3.6" transform="rotate(30 ${x} ${y})" fill="${b.fg}" stroke="#8a6a2e" stroke-width=".8"/>`).join('');
      return `<rect width="320" height="180" fill="${b.bg}"/>
        <path d="${d}" stroke="${b.accent}" stroke-width="3" fill="none" stroke-linecap="round" opacity=".25"/>
        <path d="${d}" stroke="${b.accent}" stroke-width="1.1" fill="none" stroke-linecap="round"/>${dots}`;
    },
    garden(b,r){
      let s=`<rect width="320" height="180" fill="${b.bg}"/><circle cx="262" cy="42" r="40" fill="#e9ecdf" opacity=".06"/><circle cx="262" cy="42" r="14" fill="#e9ecdf"/>
        <rect y="150" width="320" height="30" fill="#04080b"/>`;
      for(let i=0;i<40;i++)s+=`<rect x="${(r()*320).toFixed(0)}" y="${(r()*110).toFixed(0)}" width="1.2" height="1.2" fill="${b.fg}" opacity="${(.3+r()*.5).toFixed(2)}"/>`;
      const plants=[[40,70,0],[92,36,1],[150,96,2],[212,52,0],[268,80,1]];
      for(const[x,h,kind]of plants){
        const top=150-h,bend=(r()-.5)*20;
        s+=`<path d="M${x} 150Q${x+bend} ${150-h*.5} ${x+bend*.6} ${top}" stroke="${b.accent2}" stroke-width="1.8" fill="none"/>`;
        for(let k=1;k<4;k++){const ly=150-h*k/4,lx=x+bend*.5*k/4,sd=k%2?1:-1;s+=`<path d="M${lx} ${ly}q${sd*8} -7 ${sd*15} -2q${-sd*7} 6 ${-sd*15} 2z" fill="${b.accent2}" opacity=".85"/>`}
        if(kind===2){for(let p=0;p<6;p++){const a=p/6*Math.PI*2;s+=`<ellipse cx="${(x+bend*.6+Math.cos(a)*7).toFixed(1)}" cy="${(top+Math.sin(a)*7).toFixed(1)}" rx="6" ry="3" transform="rotate(${p*60} ${(x+bend*.6+Math.cos(a)*7).toFixed(1)} ${(top+Math.sin(a)*7).toFixed(1)})" fill="#e6a7c8" opacity=".85"/>`}
          s+=`<circle cx="${x+bend*.6}" cy="${top}" r="3" fill="${b.accent}"/>`}
      }
      for(let i=0;i<9;i++)s+=`<circle cx="${(r()*320).toFixed(0)}" cy="${(60+r()*80).toFixed(0)}" r="1.8" fill="${b.accent}" opacity="${(.4+r()*.6).toFixed(2)}"/>`;
      return s;
    },
    dial(b){
      let s=`<rect width="320" height="180" fill="${b.bg}"/><g transform="translate(110 90)">
        <circle r="70" fill="#0d0f10" stroke="#363c40"/><circle r="64" fill="none" stroke="${b.accent}" opacity=".5"/>`;
      for(let i=0;i<50;i++){const a=i*7.2*Math.PI/180,l=i%5?4:9;s+=`<line x1="${(Math.sin(a)*62).toFixed(1)}" y1="${(-Math.cos(a)*62).toFixed(1)}" x2="${(Math.sin(a)*(62-l)).toFixed(1)}" y2="${(-Math.cos(a)*(62-l)).toFixed(1)}" stroke="#8b8f88" stroke-width="${i%5?.7:1.4}"/>`}
      for(let d=0;d<10;d++){const a=d*36*Math.PI/180;s+=`<text x="${(Math.sin(a)*42).toFixed(1)}" y="${(-Math.cos(a)*42).toFixed(1)}" fill="${b.fg}" font-size="11" font-family="sans-serif" font-weight="600" text-anchor="middle" dominant-baseline="central">${d}</text>`}
      s+=`<circle r="22" fill="#1f2326" stroke="#363c40"/><circle r="16" fill="none" stroke="${b.accent}" stroke-width="2"/><circle r="3.5" fill="${b.accent}"/></g>`;
      const rows=[[1,1],[2,1],[4,0]];
      rows.forEach(([set,click],i)=>{for(let j=0;j<4;j++){const cx=216+j*18,cy=62+i*28;
        s+=j<set?`<circle cx="${cx}" cy="${cy}" r="6" fill="${b.accent}"/>`:j<set+click?`<circle cx="${cx}" cy="${cy}" r="5" fill="none" stroke="${b.accent}" stroke-width="2"/>`:`<circle cx="${cx}" cy="${cy}" r="6" fill="#2a2f33"/>`}});
      return s;
    },
    hypnogram(b,r){
      let s=`<rect width="320" height="180" fill="${b.bg}"/>`;
      for(let i=0;i<50;i++)s+=`<circle cx="${(r()*320).toFixed(0)}" cy="${(r()*70).toFixed(0)}" r="${(.4+r()*.8).toFixed(1)}" fill="${b.fg}" opacity="${(.2+r()*.5).toFixed(2)}"/>`;
      const y=d=>40+d*30, L=24, Rr=300, cyc=5, w=(Rr-L)/cyc;
      let d=`M${L} ${y(0)}`, rem='', deep='';
      for(let c=0;c<cyc;c++){
        const x0=L+c*w, dp=Math.max(0,.3-c*.09), rm=.1+c*.07;
        const seq=[[2,.05],[3,(1-dp-rm-.1)/2],[4,dp],[3,(1-dp-rm-.1)/2],[2,.05],[1,rm]];
        let x=x0;
        for(const[depth,f]of seq){if(f<=0)continue;const x1=x+w*f;d+=`L${x.toFixed(1)} ${y(depth)}L${x1.toFixed(1)} ${y(depth)}`;
          if(depth===1)rem+=`<rect x="${x.toFixed(1)}" y="${y(1)-4}" width="${(x1-x).toFixed(1)}" height="8" rx="3" fill="${b.accent2}"/>`;
          if(depth===4)deep+=`<rect x="${x.toFixed(1)}" y="${y(4)-4}" width="${(x1-x).toFixed(1)}" height="8" rx="3" fill="#5b4fd6"/>`;
          x=x1}
      }
      d+=`L${Rr} ${y(0)}`;
      return s+rem+deep+`<path d="${d}" fill="none" stroke="${b.fg}" stroke-width="1.4" stroke-linejoin="round"/><circle cx="${Rr}" cy="${y(0)}" r="5" fill="${b.accent}"/>`;
    }
  };

  const fmtDate = iso => new Date(iso+'T12:00:00').toLocaleDateString('en-GB',{day:'numeric',month:'long',year:'numeric'});
  const esc = s => String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

  const grid = document.getElementById('grid');
  B.forEach(b=>{
    const li=document.createElement('li');
    const a=document.createElement('a');
    a.className='tile'; a.href='play.html?b='+encodeURIComponent(b.slug);
    a.style.setProperty('--bg',b.panel||b.bg); a.style.setProperty('--fg',b.fg); a.style.setProperty('--accent',b.accent);
    const art = MOTIFS[b.motif] ? `<svg viewBox="0 0 320 180" preserveAspectRatio="xMidYMid ${b.motif==='dial'?'meet':'slice'}" aria-hidden="true">${MOTIFS[b.motif](b,rng(seed(b.slug)))}</svg>` : '';
    const ts=`font-family:${b.font};font-style:${b.fontStyle||'normal'};font-weight:${b.fontWeight||400};letter-spacing:${b.letterSpacing||'normal'}`;
    a.innerHTML=`${art}<div class="txt"><span class="kind">${esc(b.kind)}</span><h2 style="${ts}">${esc(b.title)}</h2><p>${esc(b.blurb)}</p></div>`;
    li.appendChild(a); grid.appendChild(li);
  });

  document.getElementById('tally').innerHTML = `<b>${B.length}</b> builds so far`;
  if(B.length) document.getElementById('updated').textContent = 'Latest: ' + fmtDate(B.map(b=>b.date).sort().pop());
})();
</script>
</body>
</html>
